name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the release asset: fails if manifest.json and package.json disagree on the version,
      # or the manifest points at a file the build did not produce
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: extension-release-zip
          path: release/*.zip
